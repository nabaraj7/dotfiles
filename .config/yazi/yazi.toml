[opener]
edit = [
    { run = 'nvim %s', block = true, desc = "Edit" }
]
view = [
    { run = 'imv %s', detach = true, desc = "View Image" }
]
web = [
    { run = 'brave-origin-bin %s', detach = true, desc = "Open in Browser" }
]
pdf = [
    { run = 'zathura %s', detach = false, orphan = true, desc = "Open PDF in Zathura" }
]
play = [
    { run = 'mpv %s', detach = true, desc = "Play Media" }
]

[mgr]
ratio = [ 1, 4, 3 ]

[preview]
max_width = 600
max_height = 900
image_filter = "triangle"
image_quality = 75

[open]
prepend_rules = [
    { mime = "application/pdf", use = "pdf" },
    { mime = "image/*", use = "view" },
    { mime = "{video,audio}/*", use = "play" },
    { mime = "text/*", use = "edit" },
    { url = "*.{rs,go,py,sh,toml,yaml,yml,json,md,txt}", use = "edit" },
]
append_rules = [
    { mime = "*", use = "edit" },
]
